services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assetguardog
      POSTGRES_USER: assetguardog
      POSTGRES_PASSWORD: assetguardog_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetguardog"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://assetguardog:assetguardog_secret@db:5432/assetguardog
      SECRET_KEY: assetguard-secret-key-change-in-prod
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
